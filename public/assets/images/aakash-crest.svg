<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064e3b" />
      <stop offset="50%" stop-color="#047857" />
      <stop offset="100%" stop-color="#022c22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="50%" stop-color="#eab308" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="sproutGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#86efac" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Rounded Shield -->
  <rect x="6" y="6" width="108" height="108" rx="30" fill="url(#shieldGrad)" stroke="#10b981" stroke-width="2.5" stroke-opacity="0.4" />
  
  <!-- Subtle Topographical Radar Rings -->
  <circle cx="60" cy="60" r="44" stroke="#34d399" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="3 3" />
  <circle cx="60" cy="60" r="32" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.25" />
  <circle cx="60" cy="60" r="20" stroke="#fde047" stroke-width="1" stroke-opacity="0.2" stroke-dasharray="2 2" />

  <!-- Cloud & Sun Micro-Climate Icon (Top Center) -->
  <path d="M48 42 A 8 8 0 0 1 64 38 A 10 10 0 0 1 76 46 A 7 7 0 0 1 72 56 L 46 56 A 7 7 0 0 1 48 42 Z" fill="#ffffff" fill-opacity="0.9" />
  <circle cx="44" cy="36" r="6" fill="url(#goldGrad)" filter="url(#glow)" />

  <!-- Rain Droplets / Micro-Downscale Telemetry -->
  <path d="M48 62 C48 60 50 58 50 58 C50 58 52 60 52 62 C52 63.5 51 64.5 50 64.5 C49 64.5 48 63.5 48 62 Z" fill="url(#skyGrad)" />
  <path d="M58 64 C58 62 60 60 60 60 C60 60 62 62 62 64 C62 65.5 61 66.5 60 66.5 C59 66.5 58 65.5 58 64 Z" fill="url(#skyGrad)" />
  <path d="M68 62 C68 60 70 58 70 58 C70 58 72 60 72 62 C72 63.5 71 64.5 70 64.5 C69 64.5 68 63.5 68 62 Z" fill="url(#skyGrad)" />

  <!-- Golden Wheat Ear / Crop Sprout Base -->
  <path d="M60 88 L60 68" stroke="url(#goldGrad)" stroke-width="3" stroke-linecap="round" />
  
  <!-- Left Sprout Leaf -->
  <path d="M60 78 C52 75 48 68 50 62 C55 64 58 70 60 78 Z" fill="url(#sproutGrad)" />
  <!-- Right Sprout Leaf -->
  <path d="M60 73 C68 70 72 63 70 57 C65 59 62 65 60 73 Z" fill="url(#sproutGrad)" />

  <!-- Golden Grain Grains -->
  <ellipse cx="56" cy="82" rx="3.5" ry="2" transform="rotate(-30 56 82)" fill="url(#goldGrad)" />
  <ellipse cx="64" cy="80" rx="3.5" ry="2" transform="rotate(30 64 80)" fill="url(#goldGrad)" />
  <ellipse cx="56" cy="74" rx="3.5" ry="2" transform="rotate(-30 56 74)" fill="url(#goldGrad)" />
  <ellipse cx="64" cy="72" rx="3.5" ry="2" transform="rotate(30 64 72)" fill="url(#goldGrad)" />
  
  <!-- Glowing AI Telemetry Beacon Dot -->
  <circle cx="60" cy="24" r="3" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="60" cy="24" r="1.5" fill="#ffffff" />
</svg>